<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src * data: blob:; connect-src 'none'; frame-src data: about:">
  <title>Lostman</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header id="topbar">
    <div class="brand">
      <img class="logo" src="assets/icon-64.png" alt="" width="24" height="24">
      <span class="brand-name">Lostman</span>
    </div>
    <div class="env-area">
      <select id="envSelect" title="Active environment"></select>
      <button id="btnManageEnv" class="ghost" title="Manage environments">Environments</button>
      <button id="btnSettings" class="ghost" title="Settings">Settings</button>
    </div>
  </header>

  <div id="main">
    <aside id="sidebar">
      <div class="side-tabs">
        <button data-sideview="collections" class="active">Collections</button>
        <button data-sideview="history">History</button>
      </div>
      <div class="side-search">
        <input id="sideSearch" type="text" spellcheck="false" placeholder="Filter…">
      </div>
      <div id="sideActions"></div>
      <div id="sideList"></div>
    </aside>

    <div id="content">
      <div id="tabsBar">
        <div id="tabsList"></div>
        <button id="btnNewTab" title="New request tab (Ctrl+T)">+</button>
      </div>

      <div id="editor">
        <div class="request-line">
          <select id="method" class="m-GET">
            <option>GET</option>
            <option>POST</option>
            <option>PUT</option>
            <option>PATCH</option>
            <option>DELETE</option>
            <option>HEAD</option>
            <option>OPTIONS</option>
          </select>
          <input id="url" type="text" spellcheck="false" autocomplete="off"
                 placeholder="Enter request URL — e.g. https://api.example.com/users?page=2   ({{variables}} supported)">
          <button id="btnSend" class="primary" title="Send request (Ctrl+Enter)">Send</button>
          <button id="btnSave" title="Save to collection (Ctrl+S) — right-click a tab for Save As">Save</button>
          <button id="btnCurl" class="ghost" title="Copy as cURL command">cURL</button>
        </div>

        <div class="editor-tabs">
          <button data-panel="params" class="active">Params<span id="cntParams" class="cnt"></span></button>
          <button data-panel="headers">Headers<span id="cntHeaders" class="cnt"></span></button>
          <button data-panel="body">Body<span id="dotBody" class="dot hidden"></span></button>
          <button data-panel="auth">Auth<span id="dotAuth" class="dot hidden"></span></button>
        </div>

        <div id="panels">
          <div id="panel-params" class="panel active">
            <div class="panel-hint">Synced with the URL — edit either side and the other updates. Disabled rows are kept out of the URL.</div>
            <div id="kvParams" class="kv"></div>
          </div>

          <div id="panel-headers" class="panel">
            <div class="panel-hint">Headers sent with the request. Content-Type is added automatically for raw JSON bodies unless you set one.</div>
            <div id="kvHeaders" class="kv"></div>
          </div>

          <div id="panel-body" class="panel">
            <div class="body-modes">
              <label><input type="radio" name="bodyMode" value="none"> none</label>
              <label><input type="radio" name="bodyMode" value="formdata"> form-data</label>
              <label><input type="radio" name="bodyMode" value="urlencoded"> x-www-form-urlencoded</label>
              <label><input type="radio" name="bodyMode" value="raw"> raw</label>
              <select id="rawType" class="hidden">
                <option value="json">JSON</option>
                <option value="text">Text</option>
              </select>
              <button id="btnBeautify" class="ghost hidden" title="Format JSON">Beautify</button>
            </div>
            <div id="bodyNone" class="body-area body-none">This request has no body</div>
            <textarea id="rawBody" class="body-area hidden" spellcheck="false"
                      placeholder='{&#10;  "key": "value"&#10;}'></textarea>
            <div id="kvForm" class="kv body-area hidden"></div>
          </div>

          <div id="panel-auth" class="panel">
            <div class="auth-row">
              <label for="authType">Type</label>
              <select id="authType">
                <option value="none">No Auth</option>
                <option value="bearer">Bearer Token</option>
                <option value="basic">Basic Auth</option>
                <option value="apikey">API Key</option>
              </select>
            </div>
            <div id="auth-bearer" class="auth-group hidden">
              <label for="authToken">Token</label>
              <input id="authToken" type="text" spellcheck="false" placeholder="Token ({{variables}} supported)">
            </div>
            <div id="auth-basic" class="auth-group hidden">
              <label for="authUser">Username</label>
              <input id="authUser" type="text" spellcheck="false">
              <label for="authPass">Password</label>
              <input id="authPass" type="password">
            </div>
            <div id="auth-apikey" class="auth-group hidden">
              <label for="authKeyName">Key</label>
              <input id="authKeyName" type="text" spellcheck="false" placeholder="e.g. X-Api-Key">
              <label for="authKeyValue">Value</label>
              <input id="authKeyValue" type="text" spellcheck="false">
              <label for="authAddTo">Add to</label>
              <select id="authAddTo">
                <option value="header">Header</option>
                <option value="query">Query Params</option>
              </select>
            </div>
          </div>
        </div>
      </div>

      <div id="splitter" title="Drag to resize"></div>

      <div id="responsePane">
        <div id="respToolbar" class="hidden">
          <div class="resp-tabs">
            <button data-rtab="body" class="active">Body</button>
            <button data-rtab="headers">Headers<span id="respHdrCount" class="cnt"></span></button>
          </div>
          <div class="resp-views" id="respViews">
            <button data-rview="pretty" class="active">Pretty</button>
            <button data-rview="raw">Raw</button>
            <button data-rview="preview" id="btnPreview" class="hidden">Preview</button>
          </div>
          <div class="resp-meta">
            <span id="respStatus" class="pill"></span>
            <span id="respTime" class="meta"></span>
            <span id="respSize" class="meta"></span>
            <button id="btnFindResp" class="ghost" title="Find in response (Ctrl+F)">Find</button>
            <button id="btnCopyResp" class="ghost" title="Copy response body">Copy</button>
            <button id="btnSaveResp" class="ghost" title="Save response body to a file">Save</button>
          </div>
        </div>
        <div id="respSearchBar" class="hidden">
          <input id="respSearchInput" type="text" spellcheck="false" placeholder="Find in response body…">
          <span id="respSearchCount" class="meta"></span>
          <button id="btnSearchPrev" class="ghost" title="Previous match (Shift+Enter)">▲</button>
          <button id="btnSearchNext" class="ghost" title="Next match (Enter)">▼</button>
          <button id="btnSearchClose" class="ghost" title="Close (Esc)">✕</button>
        </div>
        <div id="respContent"></div>
      </div>
    </div>
  </div>

  <div id="modalRoot"></div>
  <div id="toastRoot"></div>
  <div id="ctxRoot"></div>

  <script src="app.js"></script>
</body>
</html>
